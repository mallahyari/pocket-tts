# DISTRIBUTION template: the config you publish alongside a trained Farsi
# model, so that `uvx pocket-tts generate --config hf://<you>/<repo>/farsi.yaml`
# works for anyone.
#
# Fill in the two paths marked TODO with your own uploaded files. Upload:
#   model.safetensors  the EMA export from run_dir (flow_lm.* + mimi.* keys)
#   tokenizer.model    the sentencepiece model from prepare_data_fa.py
# and pin both with @<commit sha> so a later push cannot change what users get.
#
# num_layers below must match the model you actually trained: 6 for the
# distilled student, 24 if you are publishing the teacher.
#
# lookup_table.n_bins MUST equal the sentencepiece vocab size exactly
# (pocket_tts/conditioners/text.py asserts it), and tokenizer_path must point
# at the tokenizer trained by training/scripts/train_tokenizer.py on Persian
# transcripts. Both are set below for the default --vocab-size 4000.

weights_path: hf://TODO_your_hf_user/TODO_your_repo/model.safetensors@TODO_commit_sha
# Sampling temperature the CLI uses by default; re-tune it on your own
# checkpoints (0.3 is the English model's, 0.7 the other languages').
default_temperature: 0.3


flow_lm:
  insert_bos_before_voice: true
  dtype: float32
  flow:
    depth: 6
    dim: 512
  transformer:
    d_model: 1024
    hidden_scale: 4
    max_period: 10000
    num_heads: 16
    num_layers: 6
  lookup_table:
    dim: 1024
    n_bins: 4000
    tokenizer: sentencepiece
    tokenizer_path: hf://TODO_your_hf_user/TODO_your_repo/tokenizer.model@TODO_commit_sha
  #weights_path: final.safetensors

mimi:
  dtype: float32
  sample_rate: 24000
  inner_dim: 32
  outer_dim: 512
  channels: 1
  frame_rate: 12.5
  seanet:
    dimension: 512
    channels: 1
    n_filters: 64
    n_residual_layers: 1
    ratios:
    - 6
    - 5
    - 4
    kernel_size: 7
    residual_kernel_size: 3
    last_kernel_size: 3
    dilation_base: 2
    pad_mode: constant
    compress: 2
  transformer:
    d_model: 512
    num_heads: 8
    num_layers: 2
    layer_scale: 0.01
    context: 250
    dim_feedforward: 2048
    input_dimension: 512
    output_dimensions:
    - 512
  quantizer:
    dimension: 32
    output_dimension: 512
  #weights_path: codec.safetensors
