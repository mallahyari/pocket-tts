# Path B: fine-tune the released 24-layer English model on Farsi instead of
# training from scratch. Cheaper (usable output in 20-50k steps instead of
# 400k) and the only sane option below ~300h of data, at the cost of a text
# front-end that was not built for Persian.
#
# `model_config` is the RELEASED config, so `start_from_pretrained: true`
# warm-starts every FlowLM tensor -- backbone, flow head, EOS head and the
# text embedding table -- and the tokenizer stays the released one. That
# tokenizer does cover the Persian script (it has pieces for Persian letters
# and byte-fallback for the rest), but it spends ~1.2 tokens per character on
# Persian instead of the ~3 characters per token a Persian tokenizer gets, so
# text prefixes are ~3x longer than they need to be.
#
# The alternative -- your own Persian tokenizer with --vocab-size 4000 -- keeps
# every tensor shape identical (the embedding is n_bins + 1 = 4001 rows either
# way), so the checkpoint still loads: point model_config at
# training/farsi/configs/model_farsi.yaml with the num_layers override below
# and set weights_path to the released 24l model.safetensors. The embedding
# rows then mean different pieces than they did in English and have to be
# relearned, which costs a few thousand steps; everything else transfers.
model_config: pocket_tts/config/english_2026-04_24l.yaml
start_from_pretrained: true

data:
  train_jsonl: data/farsi_600h/train_aligned.jsonl
  valid_jsonl: data/farsi_600h/valid_aligned.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 5.0

flow:
  type: lsd
  kwargs: {}

flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  # An order of magnitude below the from-scratch 2e-4: at 2e-4 the warm start
  # is destroyed in the first few thousand steps and you have paid for a
  # pretrained model you then threw away.
  lr: 2e-5
  schedule: cosine
  warmup_steps: 500
  lr_min_ratio: 0.1

run_dir: runs/finetune_fa
batch_size: 8
grad_accum_steps: 1
max_steps: 60000
# The released weights already carry calibrated latent-normalization buffers;
# re-estimating them on Farsi audio would fight the warm start.
stats_ema_steps: 0
ema_decay: 0.999
log_freq: 50
valid_freq: 2500
ckpt_freq: 2500
num_ckpt_keep: 3
sample_cfg_coef: 2.0
sample_sentences:
  - "سلام، حال شما چطور است؟"
  - "این صدا هنوز در حال آموزش است و کیفیت آن بهتر خواهد شد."
  - "امروز هوای تهران آفتابی است و دمای هوا به بیست و پنج درجه می‌رسد."
sample_freq: 5000
